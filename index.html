<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BRKLIVE 19 — Studio Control Panel</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { background: #0b0f17; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
</style>
</head>
<body class="min-h-screen p-6">
  <div class="max-w-6xl mx-auto space-y-6">
    <!-- Top Bar -->
    <header class="flex items-center justify-between bg-slate-900 border border-slate-800 p-4 rounded-xl">
      <div>
        <h1 class="text-xl font-black tracking-wider text-emerald-400">BRKLIVE 19 <span class="text-xs text-slate-400 font-normal">STUDIO</span></h1>
        <p class="text-xs text-slate-400">Broadcast Scoring & Overlay Controller</p>
      </div>
      <div class="flex items-center gap-3">
        <button onclick="openOverlayWindow()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-bold rounded-lg transition">Open Overlay Window</button>
        <button onclick="resetMatch()" class="px-3 py-2 bg-rose-900/50 hover:bg-rose-800/50 text-rose-300 text-sm font-semibold rounded-lg border border-rose-800/55 transition">Reset</button>
      </div>
    </header>

    <!-- Main Grid -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <!-- Left/Center: Scoring & Match State -->
      <div class="lg:col-span-2 space-y-6">
        <!-- Scoreboard Summary Card -->
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-xl space-y-4">
          <div class="flex items-center justify-between">
            <h2 id="dispTeam" class="text-2xl font-black">TEAM A</h2>
            <div id="dispScore" class="text-3xl font-black tabular-nums">0/0 <span class="text-sm font-semibold text-slate-400">(0.0 ov)</span></div>
          </div>
          <div class="grid grid-cols-2 gap-4 text-sm bg-slate-950/50 p-4 rounded-lg border border-slate-800/60">
            <div>
              <div class="text-slate-400 text-xs">Striker</div>
              <div id="dispStriker" class="font-bold">- (0)</div>
            </div>
            <div>
              <div class="text-slate-400 text-xs">Bowler</div>
              <div id="dispBowler" class="font-bold">- (0-0-0)</div>
            </div>
          </div>
        </div>

        <!-- Quick Score Pad -->
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-xl space-y-4">
          <h3 class="text-sm font-bold uppercase tracking-wider text-slate-400">Run Scoring</h3>
          <div class="grid grid-cols-4 sm:grid-cols-7 gap-3">
            <button onclick="addRuns(0)" class="py-4 bg-slate-800 hover:bg-slate-700 font-black rounded-lg">0</button>
            <button onclick="addRuns(1)" class="py-4 bg-slate-800 hover:bg-slate-700 font-black rounded-lg">1</button>
            <button onclick="addRuns(2)" class="py-4 bg-slate-800 hover:bg-slate-700 font-black rounded-lg">2</button>
            <button onclick="addRuns(3)" class="py-4 bg-slate-800 hover:bg-slate-700 font-black rounded-lg">3</button>
            <button onclick="addRuns(4)" class="py-4 bg-emerald-600/30 hover:bg-emerald-600/50 text-emerald-300 font-black rounded-lg border border-emerald-500/30">4</button>
            <button onclick="addRuns(6)" class="py-4 bg-indigo-600/30 hover:bg-indigo-600/50 text-indigo-300 font-black rounded-lg border border-indigo-500/30">6</button>
            <button onclick="addWicket()" class="py-4 bg-rose-600 hover:bg-rose-500 font-black rounded-lg col-span-2 sm:col-span-1">WKT</button>
          </div>
          <div class="flex gap-3 pt-2">
            <button onclick="addExtra('wide')" class="flex-1 py-2 bg-slate-800 hover:bg-slate-700 text-xs font-bold rounded-lg">+1 Wide</button>
            <button onclick="addExtra('noball')" class="flex-1 py-2 bg-slate-800 hover:bg-slate-700 text-xs font-bold rounded-lg">+1 No Ball</button>
            <button onclick="undoLast()" class="flex-1 py-2 bg-amber-900/40 hover:bg-amber-800/40 text-amber-300 text-xs font-bold rounded-lg border border-amber-800/50">Undo</button>
          </div>
        </div>

        <!-- Animation Triggers -->
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-xl space-y-4">
          <h3 class="text-sm font-bold uppercase tracking-wider text-slate-400">Broadcast Animations</h3>
          <div class="grid grid-cols-4 gap-3">
            <button onclick="triggerAnim('FOUR')" class="py-3 bg-slate-800 hover:bg-emerald-600 text-xs font-bold rounded-lg transition">FOUR</button>
            <button onclick="triggerAnim('SIX')" class="py-3 bg-slate-800 hover:bg-indigo-600 text-xs font-bold rounded-lg transition">SIX</button>
            <button onclick="triggerAnim('WICKET')" class="py-3 bg-slate-800 hover:bg-rose-600 text-xs font-bold rounded-lg transition">WICKET</button>
            <button onclick="clearAnim()" class="py-3 bg-slate-800 hover:bg-slate-700 text-xs font-bold rounded-lg transition">Clear Anim</button>
          </div>
        </div>
      </div>

      <!-- Right Column: Config & Meta -->
      <div class="space-y-6">
        <!-- Display Mode & Target -->
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-xl space-y-4">
          <h3 class="text-sm font-bold uppercase tracking-wider text-slate-400">Display Mode</h3>
          <select id="selDisplayMode" onchange="updateMetaConfig()" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm">
            <option value="scorebar">Scorebar</option>
            <option value="target">Target Mode</option>
          </select>
          <div>
            <label class="text-xs text-slate-400">Target Score (optional)</label>
            <input type="number" id="inpTarget" onchange="updateMetaConfig()" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm mt-1" placeholder="150" />
          </div>
        </div>

        <!-- Overlay Styling -->
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-xl space-y-4">
          <h3 class="text-sm font-bold uppercase tracking-wider text-slate-400">Overlay Appearance</h3>
          <div class="space-y-3 text-xs">
            <div>
              <label class="text-slate-400">Design Style</label>
              <select id="selDesign" onchange="updateOverlayStyle()" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 mt-1">
                <option value="standard">Standard Bar</option>
                <option value="corner">Corner Accent</option>
              </select>
            </div>
            <div>
              <label class="text-slate-400">Accent Color</label>
              <input type="color" id="inpAccent" value="#00e0a4" onchange="updateOverlayStyle()" class="w-full h-9 bg-slate-950 border border-slate-800 rounded-lg p-1 mt-1" />
            </div>
            <div>
              <label class="text-slate-400">Scale (%)</label>
              <input type="number" id="inpScale" value="100" min="50" max="150" onchange="updateOverlayStyle()" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 mt-1" />
            </div>
            <div class="flex items-center justify-between pt-2">
              <label class="text-slate-400">Show Batsmen</label>
              <input type="checkbox" id="chkShowBat" checked onchange="updateOverlayStyle()" />
            </div>
            <div class="flex items-center justify-between">
              <label class="text-slate-400">Show Bowler</label>
              <input type="checkbox" id="chkShowBowl" checked onchange="updateOverlayStyle()" />
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
const LS_KEY = 'brklive19.studio.v1';
const CH_NAME = 'brklive19-overlay';
const channel = ('BroadcastChannel' in window) ? new BroadcastChannel(CH_NAME) : null;

let state = null;

function defaultState() {
  return {
    meta: {
      matchTitle: 'Match 1',
      teams: [
        { name: 'Team A', short: 'TMA', color: '#00e0a4' },
        { name: 'Team B', short: 'TMB', color: '#3b82f6' }
      ]
    },
    current: 0,
    displayMode: 'scorebar',
    innings: [
      {
        battingTeam: 0,
        runs: 0,
        wickets: 0,
        balls: 0,
        target: null,
        striker: 0,
        nonStriker: 1,
        bowler: 0,
        batsmen: [
          { name: 'Player 1', r: 0, b: 0 },
          { name: 'Player 2', r: 0, b: 0 }
        ],
        bowlers: [
          { name: 'Bowler 1', runs: 0, wkts: 0, balls: 0 }
        ]
      }
    ],
    animation: null,
    overlay: {
      barBg: '#10161f',
      textColor: '#ffffff',
      accent: '#00e0a4',
      warn: '#f59e0b',
      wicket: '#ef4444',
      scale: 100,
      design: 'standard',
      showBat: true,
      showBowl: true
    },
    history: []
  };
}

function save() {
  localStorage.setItem(LS_KEY, JSON.stringify(state));
  if (channel) channel.postMessage({ type: 'state', state });
}

function load() {
  const raw = localStorage.getItem(LS_KEY);
  if (!raw) return false;
  try {
    state = JSON.parse(raw);
    return true;
  } catch(e) {
    return false;
  }
}

function renderAll() {
  if (!state || !state.innings[state.current]) return;
  const inn = state.innings[state.current];
  const bt = state.meta.teams[inn.battingTeam] || { name: 'Team', short: 'TMA' };
  const striker = inn.batsmen[inn.striker] || { name: '-', r: 0, b: 0 };
  const bowler = inn.bowlers[inn.bowler] || { name: '-', runs: 0, wkts: 0, balls: 0 };

  document.getElementById('dispTeam').textContent = bt.name;
  document.getElementById('dispScore').innerHTML = `${inn.runs}/${inn.wickets} <span class="text-sm font-semibold text-slate-400">(${Math.floor(inn.balls/6)}.${inn.balls%6} ov)</span>`;
  document.getElementById('dispStriker').textContent = `${striker.name} (${striker.r}/${striker.b})`;
  document.getElementById('dispBowler').textContent = `${bowler.name} (${bowler.runs}-${bowler.wkts}-${Math.floor(bowler.balls/6)}.${bowler.balls%6})`;

  document.getElementById('selDisplayMode').value = state.displayMode || 'scorebar';
  document.getElementById('inpTarget').value = inn.target || '';
  document.getElementById('selDesign').value = state.overlay.design || 'standard';
  document.getElementById('inpAccent').value = state.overlay.accent || '#00e0a4';
  document.getElementById('inpScale').value = state.overlay.scale || 100;
  document.getElementById('chkShowBat').checked = state.overlay.showBat !== false;
  document.getElementById('chkShowBowl').checked = state.overlay.showBowl !== false;
}

function pushHistory() {
  state.history.push(JSON.parse(JSON.stringify(state)));
  if (state.history.length > 20) state.history.shift();
}

function addRuns(r) {
  pushHistory();
  const inn = state.innings[state.current];
  inn.runs += r;
  inn.balls += 1;
  if (inn.batsmen[inn.striker]) {
    inn.batsmen[inn.striker].r += r;
    inn.batsmen[inn.striker].b += 1;
  }
  if (inn.bowlers[inn.bowler]) {
    inn.bowlers[inn.bowler].runs += r;
    inn.bowlers[inn.bowler].balls += 1;
  }
  if (r === 4) triggerAnim('FOUR');
  if (r === 6) triggerAnim('SIX');
  save();
  renderAll();
}

function addWicket() {
  pushHistory();
  const inn = state.innings[state.current];
  inn.wickets += 1;
  inn.balls += 1;
  if (inn.batsmen[inn.striker]) {
    inn.batsmen[inn.striker].b += 1;
  }
  if (inn.bowlers[inn.bowler]) {
    inn.bowlers[inn.bowler].wkts += 1;
    inn.bowlers[inn.bowler].balls += 1;
  }
  triggerAnim('WICKET');
  save();
  renderAll();
}

function addExtra(type) {
  pushHistory();
  const inn = state.innings[state.current];
  inn.runs += 1;
  if (type === 'noball') {
    if (inn.bowlers[inn.bowler]) inn.bowlers[inn.bowler].runs += 1;
  } else if (type === 'wide') {
    if (inn.bowlers[inn.bowler]) inn.bowlers[inn.bowler].runs += 1;
  }
  save();
  renderAll();
}

function undoLast() {
  if (!state.history || state.history.length === 0) return;
  state = state.history.pop();
  save();
  renderAll();
}

function triggerAnim(type) {
  state.animation = { type, id: Date.now() };
  save();
  setTimeout(() => {
    if (state.animation && state.animation.type === type) {
      state.animation = null;
      save();
    }
  }, 2500);
}

function clearAnim() {
  state.animation = null;
  save();
}

function updateMetaConfig() {
  state.displayMode = document.getElementById('selDisplayMode').value;
  const t = document.getElementById('inpTarget').value;
  state.innings[state.current].target = t ? Number(t) : null;
  save();
  renderAll();
}

function updateOverlayStyle() {
  state.overlay.design = document.getElementById('selDesign').value;
  state.overlay.accent = document.getElementById('inpAccent').value;
  state.overlay.scale = Number(document.getElementById('inpScale').value) || 100;
  state.overlay.showBat = document.getElementById('chkShowBat').checked;
  state.overlay.showBowl = document.getElementById('chkShowBowl').checked;
  save();
  renderAll();
}

function openOverlayWindow() {
  window.open('overlay.html', 'brklive19_overlay', 'width=1280,height=720,menubar=no,toolbar=no');
}

function resetMatch() {
  if (!confirm('Reset match state?')) return;
  state = defaultState();
  save();
  renderAll();
}

/* ================================================================
   BOOT
   ================================================================ */
(function boot() {
  if (!load() || !state) state = defaultState();
  const def = defaultState();
  if (!state.overlay) state.overlay = def.overlay;
  for (const k in def.overlay) {
    if (state.overlay[k] === undefined) state.overlay[k] = def.overlay[k];
  }
  save();
  renderAll();
})();
</script>
</body>
</html>
