<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BRKLIVE 19 — Overlay</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: transparent;
    font-family: system-ui, -apple-system, sans-serif;
  }
  #stage {
    position: relative;
    width: 100%;
    height: 100%;
  }
  .overlay-bar {
    position: absolute;
    bottom: 40px;
    left: 60px;
    right: 60px;
    min-height: 84px;
    padding: 14px 28px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    color: #fff;
    background: #10161f;
    box-shadow: 0 14px 40px rgba(0,0,0,.65);
    transition: all 0.15s ease;
  }
  .anim-overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,.78);
    font-size: 110px;
    font-weight: 900;
    color: #00e0a4;
    z-index: 9999;
    letter-spacing: 6px;
    text-shadow: 0 0 40px rgba(0,224,164,.7);
    pointer-events: none;
  }
  .anim-overlay.wicket {
    color: #ef4444;
    text-shadow: 0 0 40px rgba(239,68,68,.7);
  }
  .anim-overlay.six {
    color: #6366f1;
    text-shadow: 0 0 40px rgba(99,102,241,.7);
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="stage">
  <div id="mainOverlay" class="overlay-bar">
    <div id="overlayContent" style="display:flex;align-items:center;gap:20px;width:100%;">Connecting to studio...</div>
  </div>
</div>
<div id="animOverlay" class="anim-overlay hidden"><span id="animText"></span></div>

<script>
const LS_KEY = 'brklive19.studio.v1';
const CH_NAME = 'brklive19-overlay';
const channel = ('BroadcastChannel' in window) ? new BroadcastChannel(CH_NAME) : null;

function oversStr(b) {
  return `${Math.floor(b / 6)}.${b % 6}`;
}

function escapeHtml(str) {
  return String(str || '').replace(/[&<>"']/g, c => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  }[c]));
}

function renderOverlay() {
  let state = null;
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) state = JSON.parse(raw);
  } catch (e) {
    console.error('Failed to parse state', e);
  }

  const bar = document.getElementById('mainOverlay');
  const content = document.getElementById('overlayContent');
  const anim = document.getElementById('animOverlay');

  if (!state || !state.innings || !state.innings[state.current]) {
    content.innerHTML = `<div style="font-size:24px;font-weight:700;">Waiting for match data...</div>`;
    anim.classList.add('hidden');
    return;
  }

  const o = state.overlay || {};
  const inn = state.innings[state.current];
  const meta = state.meta || { teams: [] };
  const bt = meta.teams[inn.battingTeam] || { name: 'Team', short: 'TMA', color: o.accent || '#00e0a4' };
  const striker = inn.batsmen && inn.batsmen[inn.striker] ? inn.batsmen[inn.striker] : { name: '-', r: 0, b: 0 };
  const nonStriker = inn.batsmen && inn.batsmen[inn.nonStriker] ? inn.batsmen[inn.nonStriker] : { name: '-', r: 0, b: 0 };
  const bowler = inn.bowlers && inn.bowlers[inn.bowler] ? inn.bowlers[inn.bowler] : { name: '-', runs: 0, wkts: 0, balls: 0 };

  // Apply styling properties
  bar.style.backgroundColor = o.barBg || '#10161f';
  bar.style.color = o.textColor || '#ffffff';
  bar.style.transform = `scale(${(Number(o.scale) || 100) / 100})`;
  bar.style.transformOrigin = 'bottom center';

  if (o.design === 'corner') {
    bar.style.borderLeft = `6px solid ${o.accent || '#00e0a4'}`;
    bar.style.borderRadius = '4px 14px 14px 4px';
  } else {
    bar.style.borderLeft = 'none';
    bar.style.borderRadius = '14px';
  }

  const mode = state.displayMode || 'scorebar';
  let targetHtml = '';
  if (mode === 'target' && inn.target) {
    targetHtml = `<div style="margin-left:auto;color:${o.warn || '#f59e0b'};font-weight:800;font-size:20px;">TARGET: ${inn.target}</div>`;
  }

  const teamColor = bt.color || o.accent || '#00e0a4';

  content.innerHTML = `
    <div style="display:flex;align-items:center;gap:22px;width:100%;">
      <div style="width:8px;height:52px;background:${teamColor};border-radius:4px;flex-shrink:0;"></div>
      <div style="font-size:26px;font-weight:800;letter-spacing:-0.5px;">${escapeHtml(bt.short || bt.name)}</div>
      <div style="font-size:42px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1;">
        ${inn.runs}<span style="color:${o.wicket || '#ef4444'};">/${inn.wickets}</span>
        <span style="font-size:18px;color:#94a3b8;font-weight:600;margin-left:8px;">(${oversStr(inn.balls)} ov)</span>
      </div>
      ${o.showBat !== false ? `
        <div style="margin-left:16px;padding-left:16px;border-left:1px solid rgba(255,255,255,0.12);font-size:14px;color:#cbd5e1;line-height:1.45;">
          <div><b style="color:#fff;">● ${escapeHtml(striker.name)}</b> ${striker.r}(${striker.b})</div>
          <div style="color:#94a3b8;">${escapeHtml(nonStriker.name)} ${nonStriker.r}(${nonStriker.b})</div>
        </div>
      ` : ''}
      ${o.showBowl !== false ? `
        <div style="margin-left:16px;padding-left:16px;border-left:1px solid rgba(255,255,255,0.12);font-size:14px;color:#cbd5e1;line-height:1.45;">
          <div><b style="color:#fff;">🎳 ${escapeHtml(bowler.name)}</b></div>
          <div style="color:#94a3b8;">${Math.floor(bowler.balls/6)}.${bowler.balls%6}–${bowler.runs}–${bowler.wkts}</div>
        </div>
      ` : ''}
      ${targetHtml}
    </div>
  `;

  // Animation popup layer
  if (state.animation && state.animation.type) {
    const t = String(state.animation.type).toUpperCase();
    anim.className = 'anim-overlay';
    if (t === 'WICKET') anim.classList.add('wicket');
    else if (t === 'SIX') anim.classList.add('six');
    document.getElementById('animText').textContent = t;
    anim.classList.remove('hidden');
  } else {
    anim.classList.add('hidden');
  }
}

// Initial render
renderOverlay();

// Listeners for instant sync
window.addEventListener('storage', e => {
  if (e.key === LS_KEY) renderOverlay();
});

if (channel) {
  channel.onmessage = e => {
    if (e.data && e.data.type === 'state') {
      renderOverlay();
    }
  };
}

// Fallback safety polling for multi-window sync quirks
setInterval(renderOverlay, 350);
</script>
</body>
</html>
